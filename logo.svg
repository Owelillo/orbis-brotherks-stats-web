<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#c77dff"/>
      <stop offset="0.45" stop-color="#8500d7"/>
      <stop offset="1" stop-color="#4b0082"/>
    </radialGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe6ff"/>
      <stop offset="1" stop-color="#42d6ff"/>
    </linearGradient>
  </defs>
  <!-- anillo (mitad trasera) -->
  <g transform="rotate(-18 246 262)">
    <path d="M 18 262 A 228 62 0 0 1 474 262" fill="none" stroke="#0d0833" stroke-width="34" stroke-linecap="round"/>
    <path d="M 18 262 A 228 62 0 0 1 474 262" fill="none" stroke="url(#cy)" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- sombra dura del orbe -->
  <circle cx="270" cy="280" r="178" fill="#0d0833"/>
  <!-- orbe -->
  <circle cx="246" cy="258" r="178" fill="url(#orb)" stroke="#0d0833" stroke-width="16"/>
  <ellipse cx="180" cy="168" rx="62" ry="30" fill="#ffffff" opacity="0.28" transform="rotate(-32 180 168)"/>
  <!-- barras inclinadas -->
  <g stroke="#0d0833" stroke-width="12" stroke-linejoin="round">
    <path d="M 150 262 L 196 262 L 186 336 L 140 336 Z" fill="#ffffff"/>
    <path d="M 222 212 L 268 212 L 254 336 L 208 336 Z" fill="#ffffff"/>
    <path d="M 294 160 L 340 160 L 322 336 L 276 336 Z" fill="url(#cy)"/>
  </g>
  <!-- anillo (mitad delantera) -->
  <g transform="rotate(-18 246 262)">
    <path d="M 474 262 A 228 62 0 0 1 18 262" fill="none" stroke="#0d0833" stroke-width="34" stroke-linecap="round"/>
    <path d="M 474 262 A 228 62 0 0 1 18 262" fill="none" stroke="url(#cy)" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- insignia de reproducción -->
  <g transform="translate(318 66)">
    <path d="M 30 10 L 150 10 L 134 104 L 14 104 Z" fill="#0d0833" transform="translate(9 8)"/>
    <path d="M 30 10 L 150 10 L 134 104 L 14 104 Z" fill="#ff3d6e" stroke="#0d0833" stroke-width="12" stroke-linejoin="round"/>
    <path d="M 66 34 L 112 57 L 66 80 Z" fill="#ffffff" stroke="#0d0833" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
